<style>
/* Layout: one narrow column, an analog radio dial on top, the turn panel underneath. Single committed night look. */
:root{
  --night:#10172a; --panel:#1a2440; --panel2:#222f52; --line:#2e3d66;
  --ink:#eef0e6; --muted:#97a3c2; --face:#f3e9d2; --faceInk:#3a3326;
  --b4:#ff5d73; --b3:#ffb238; --b2:#ffe08a; --needle:#3fd0b6;
  --teamA:#4cc9f0; --teamB:#b49cff; --good:#5fe08f; --bad:#ff7b7b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%,#1d2a52 0,transparent 55%),radial-gradient(circle at 100% 100%,#24193f 0,transparent 50%);
  background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.3rem;font-weight:900;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 140px}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);transition:transform .08s,background .15s}
button:hover{background:#2a3963}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--needle);outline-offset:2px}
.primary{background:var(--needle);color:#08231e;border-color:transparent}
.primary:hover{background:#5ee3cb}
.warm{background:var(--b3);color:#2b1a00;border-color:transparent}
.warm:hover{background:#ffc35e}
.small{padding:7px 11px;font-size:.82rem;border-radius:10px}
.ghost{background:transparent}
.wide{width:100%}
input,select{font:inherit;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input::placeholder{color:#66729a}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.2em}
.big-code{font-size:2.4rem;color:var(--b3)}
.note{font-size:.85rem;color:var(--muted);background:var(--night);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--panel2)}
.tA{color:var(--teamA)} .tB{color:var(--teamB)}
.bgA{background:color-mix(in srgb,var(--teamA) 18%,var(--panel))} .bgB{background:color-mix(in srgb,var(--teamB) 18%,var(--panel))}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.02em}
.logo span{color:var(--b3)}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.score{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.score b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.score.active{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset}
.score.right{text-align:right}
.goal{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:center}

/* dial */
.dialwrap{position:relative;background:linear-gradient(180deg,#0b1122,#141d36);border:1px solid var(--line);border-radius:22px;padding:16px 12px 12px;display:flex;flex-direction:column;gap:10px}
svg.dial{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
svg.dial.drag{cursor:grab}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.end{border-radius:12px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.25;display:flex;align-items:center;gap:8px;min-width:0}
.end.l{background:#2b3a66}
.end.r{background:#5b3a63;justify-content:flex-end;text-align:right}
.bands{transform-origin:200px 200px}
.bands.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}

.cluebox{text-align:center;display:flex;flex-direction:column;gap:4px;padding:6px 0}
.clue{font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--b2);word-break:break-word}
.opt{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;padding:12px 14px}
.opt span:last-child{text-align:right}
.opt.sel{background:var(--needle);color:#08231e;border-color:transparent}
.result{font-family:var(--display);font-size:2rem;font-weight:900;text-align:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:4px}
.plist div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lp{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.lp button{padding:10px 12px}
.customlist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.customlist div{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem;background:var(--night);border-radius:10px;padding:6px 6px 6px 12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--night);font-weight:800;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);z-index:20}
.gate{text-align:center;align-items:center;padding:28px 18px}
.gate .who{font-family:var(--display);font-size:1.6rem;font-weight:900;color:var(--b3)}
.stamp{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.net{font-family:var(--mono);font-size:.7rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.net.down i{background:var(--bad)}
</style>

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const other = t => t==='A'?'B':'A';
const keyOf = c => (c.l+'|'+c.r).toLowerCase();
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- scoring ---------------- */
const BANDS=[[3.5,4],[10.5,3],[17.5,2]];
function scoreFor(n,t){const d=Math.abs(n-t);for(const[w,p]of BANDS)if(d<=w)return p;return 0}

/* ---------------- app state ---------------- */
const app = {
  screen:'home', mode:null,       // mode: 'online' | 'local'
  myId:null,
  code:null, ref:null, unsub:null, s:null,
  peek:false, selOpt:null, dragging:false, dragVal:null, lastBandsKey:null,
  custom:[],
  localPlayers: ls.get('ti_local_players',[{name:'',team:'A'},{name:'',team:'A'},{name:'',team:'B'},{name:'',team:'B'}]),
  localGoal: 10,
};
let myName = ls.get('ti_name','');

function seenSet(){return new Set(ls.get('ti_seen',[]))}
function markSeen(cards){const s=seenSet();cards.forEach(c=>c&&s.add(keyOf(c)));const arr=[...s];ls.set('ti_seen',arr.slice(-2000))}
function buildDeck(){
  const all=[...BUILTIN,...app.custom.map(c=>({l:c.l,r:c.r}))];
  const seen=seenSet(); const fresh=[],old=[];
  const dedupe=new Set();
  for(const c of all){const k=keyOf(c);if(dedupe.has(k))continue;dedupe.add(k);(seen.has(k)?old:fresh).push(c)}
  if(fresh.length<10){ls.set('ti_seen',[]);return shuffle([...fresh,...old])}
  return [...shuffle(fresh),...shuffle(old)];
}

function newGame(goal){
  return {v:1,status:'lobby',players:{},scores:{A:0,B:0},goal,turnTeam:'A',psy:{A:0,B:0},psychic:null,phase:null,

}
function teamOf(s,t){return Object.entries(s.players||{}).filter(([,p])=>p&&p.team===t).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0)).map(([id])=>id)}
const playable=(s,t)=>teamOf(s,t).length>=2;
function draw2(s){const d=s.deck,n=d.length;const a=d[s.deckPos%n],b=d[(s.deckPos+1)%n];return{options:[a,b],deckPos:s.deckPos+2}}
function roundPatch(s,team){
  const members=teamOf(s,team);
  const psychic=members[(s.psy[team]||0)%members.length];
  const target=Math.round((17.5+Math.random()*145)*10)/10;
  return {status:'play',phase:'clue',turnTeam:team,psychic,...draw2(s),card:null,target,clue:'',needle:90,counter:null,result:null,round:(s.round||0)+1};
}
function startGamePatch(s){
  const first = playable(s,'A')?'A':'B';
  return roundPatch({...s,round:0},first);
}
function finishPatch(s,counter,needle){
  const pts=scoreFor(needle,s.target);
  const opp=other(s.turnTeam);
  let cpts=0;
  if(counter && pts<4){ if((counter==='left'&&s.target<needle)||(counter==='right'&&s.target>needle)) cpts=1 }
  const scores={...s.scores};scores[s.turnTeam]+=pts;scores[opp]+=cpts;
  return {phase:'reveal',counter:counter||null,needle,result:{pts,cpts},scores};
}
function winner(s){
  const a=s.scores.A,b=s.scores.B;
  if(Math.max(a,b)<s.goal||a===b)return null;
  return a>b?'A':'B';
}
function nextPatch(s){
  const psy={...s.psy};psy[s.turnTeam]=(psy[s.turnTeam]||0)+1;
  const s2={...s,psy};
  const nt=playable(s2,other(s.turnTeam))?other(s.turnTeam):s.turnTeam;
  return {psy,...roundPatch(s2,nt)};
}
function rematchPatch(s){
  const s2={...s,scores:{A:0,B:0},round:0};
  return {scores:{A:0,B:0},...startGamePatch(s2)};
}

/* ---------------- backend: writes ---------------- */
function deepMerge(a,b){const o={...a};for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))o[k]=deepMerge(a[k],v);else o[k]=v}return o}
function push(patch){
  if(app.mode==='local'){app.s=deepMerge(app.s,patch);ls.set('ti_local_game',app.s);render();return}
  app.s=deepMerge(app.s,patch);render(); // optimistic
  if(net.isHost)broadcast();
  else if(net.hostConn&&net.hostConn.open){try{net.hostConn.send({t:'patch',patch})}catch{toast('Couldn’t send that move. Check your connection.')}}
  else toast('Not connected to the host right now.');
}
// needle: coalesce drag updates to ~20 per second
let needleTimer=null,needlePending=null;
function sendNeedle(v){
  if(app.mode==='local'){app.s.needle=v;return}
  needlePending=v; if(needleTimer)return;
  needleTimer=setTimeout(()=>{needleTimer=null;const n=needlePending;needlePending=null;if(n==null)return;
    if(net.isHost){app.s.needle=n;net.conns.forEach(c=>{if(c.open)try{c.send({t:'needle',v:n})}catch{}});saveHost()}
    else if(net.hostConn&&net.hostConn.open){try{net.hostConn.send({t:'needle',v:n})}catch{}}
  },50);
}

/* ---------------- roles ---------------- */
function role(){
  const s=app.s; if(!s)return{};
  if(app.mode==='local') return {me:null,team:null,psychic:true,guesser:true,counter:true,player:true};
  const me=app.myId,p=s.players?.[me];
  const team=p?.team||null;
  return {me,team,player:!!p,psychic:s.psychic===me,guesser:!!p&&team===s.turnTeam&&s.psychic!==me,counter:!!p&&team&&team!==s.turnTeam};
}
const nameOf=id=>esc(app.s?.players?.[id]?.name||'Someone');

/* ---------------- dial svg ---------------- */
const CX=200,CY=200,R=182;
const pt=(a,r)=>[CX-r*Math.cos(a*Math.PI/180),CY-r*Math.sin(a*Math.PI/180)];
function wedge(a1,a2,r){a1=Math.max(0,a1);a2=Math.min(180,a2);const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);return`M${CX} ${CY}L${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z`}
function dialSVG({target,needle,showTarget,draggable,counter,pop}){
  let ticks='';
  for(let a=0;a<=180;a+=5){const big=a%30===0;const[x1,y1]=pt(a,R-2),[x2,y2]=pt(a,R-(big?16:8));ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3a3326" stroke-opacity="${big?.55:.25}" stroke-width="${big?2.5:1.5}"/>`}
  let bands='';
  if(showTarget){
    const t=target;
    bands=`<g class="bands${pop?' pop':''}">
      <path d="${wedge(t-17.5,t+17.5,R-4)}" fill="var(--b2)"/>
      <path d="${wedge(t-10.5,t+10.5,R-4)}" fill="var(--b3)"/>
      <path d="${wedge(t-3.5,t+3.5,R-4)}" fill="var(--b4)"/>
      ${[[-14,2],[-7,3],[0,4],[7,3],[14,2]].map(([o,n])=>{const[x,y]=pt(t+o,R-26);return`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="13" fill="#3a1d10">${n}</text>`}).join('')}
    </g>`;
  }
  let counterMark='';
  if(counter){const side=counter==='left';counterMark=`<text x="${side?40:360}" y="190" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="900" font-size="22" fill="var(--teamB)">${side?'◀':'▶'}</text>`}
  const[nx,ny]=pt(needle,R-10);
  return `<svg class="dial${draggable?' drag':''}" id="dial" viewBox="0 0 400 214" role="img" aria-label="Dial from left end to right end. Needle at ${Math.round(needle/1.8)} percent.">
    <defs><clipPath id="faceclip"><path d="${wedge(0,180,R)}"/></clipPath></defs>
    <path d="${wedge(0,180,R+8)}" fill="#0a0f1d" stroke="#34436e" stroke-width="2"/>
    <path d="${wedge(0,180,R)}" fill="var(--face)"/>
    <g clip-path="url(#faceclip)">${bands}${ticks}</g>
    ${counterMark}
    <g id="needle"><line id="nl" x1="${CX}" y1="${CY}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--needle)" stroke-width="9" stroke-linecap="round"/>
    <circle id="nt" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${draggable?11:6}" fill="var(--needle)" stroke="#0b1122" stroke-width="3"/></g>
    <circle cx="${CX}" cy="${CY}" r="22" fill="var(--b4)" stroke="#0b1122" stroke-width="4"/>
    <rect x="0" y="${CY}" width="400" height="14" fill="transparent"/>
  </svg>`;
}
function setNeedle(a){const[nx,ny]=pt(a,R-10);const l=$('#nl'),t=$('#nt');if(l){l.setAttribute('x2',nx.toFixed(1));l.setAttribute('y2',ny.toFixed(1))}if(t){t.setAttribute('cx',nx.toFixed(1));t.setAttribute('cy',ny.toFixed(1))}}
function angleFromEvent(e,svg){
  const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*214;
  const dx=x-CX,dy=CY-y;let a=Math.atan2(dy,-dx)*180/Math.PI;if(a<0)a=dx<0?0:180;
  return Math.round(Math.min(180,Math.max(0,a))*10)/10;
}
function wireDial(){
  const svg=$('#dial');if(!svg||!svg.classList.contains('drag'))return;
  svg.addEventListener('pointerdown',e=>{app.dragging=true;svg.setPointerCapture(e.pointerId);const a=angleFromEvent(e,svg);app.dragVal=a;setNeedle(a);sendNeedle(a)});
  svg.addEventListener('pointermove',e=>{if(!app.dragging)return;const a=angleFromEvent(e,svg);app.dragVal=a;setNeedle(a);sendNeedle(a)});
  const end=()=>{if(!app.dragging)return;app.dragging=false;if(app.s&&app.dragVal!=null)app.s.needle=app.dragVal;app.dragVal=null;if(app.mode==='local')ls.set('ti_local_game',app.s);else render()};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function nudge(d){const v=Math.min(180,Math.max(0,(app.s.needle||90)+d));app.s.needle=v;setNeedle(v);sendNeedle(v)}

/* ---------------- render ---------------- */
function render(){
  // keep typed text and focus across re-renders
  const keep={};document.querySelectorAll('#app input').forEach(i=>{if(i.id)keep[i.id]=i.value});
  const ae=document.activeElement;const focusId=ae&&ae.id&&ae.tagName==='INPUT'?ae.id:null;const sel=focusId?[ae.selectionStart,ae.selectionEnd]:null;
  let html='';
  if(app.screen==='home')html=homeView();
  else if(app.screen==='localSetup')html=localSetupView();
  else if(app.screen==='game')html=gameView();
  $('#app').innerHTML=html;
  for(const id in keep){const el=document.getElementById(id);if(el&&el.dataset.keep!=='no')el.value=keep[id]}
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(sel[0],sel[1])}catch{}}}
  wireDial();
}

function gameView(){
  const s=app.s;
  if(!s)return `${header()}<div class="card"><p class="muted">Tuning in…</p></div>`;

    } else {

    panel=`<div class="card"><div class="cluebox"><span class="eyebrow">${psyName}'s clue</span><div class="clue">“${esc(s.clue)}”</div></div>

  }
  if(ph==='counter'){

    panel=`<div class="card"><div class="cluebox"><span class="eyebrow">Clue</span><div class="clue">“${esc(s.clue)}”</div></div>
      ${(local||r.counter)?`<p style="text-align:center"><b class="t${opp}">Team ${opp}</b>: is the target left or right of the needle?</p>
        <div class="teams"><button data-act="counter" data-v="left">◀ Left</button><button data-act="counter" data-v="right">Right ▶</button></div>`
      :`<p class="muted" style="text-align:center">Team ${opp} is calling left or right…</p>`}
    </div>`;
  }
  if(ph==='reveal'){
    showTarget=true;
    const res=s.result||{pts:0,cpts:0};const opp=other(s.turnTeam);

/* ---------------- online plumbing (PeerJS: the host's browser keeps the game, others connect to it) ---------------- */
const PREFIX='tunedin-v1-';
const net={peer:null,isHost:false,conns:[],hostConn:null,status:'off',retry:0};
function randCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c}
function setHash(code){try{history.replaceState(null,'','#'+code)}catch{}}
function setNet(st){if(net.status!==st){net.status=st;const el=$('#netpill');if(el){el.className='net'+(st==='ok'?'':' down');el.lastChild.textContent=netLabel()}}}
const netLabel=()=>net.status==='ok'?(net.isHost?'Hosting':'Connected'):'Reconnecting…';
function cleanupPeer(){
  net.conns.forEach(c=>{try{c.close()}catch{}});net.conns=[];
  if(net.hostConn){const c=net.hostConn;net.hostConn=null;try{c.close()}catch{}}
  if(net.peer){try{net.peer.destroy()}catch{}}net.peer=null;net.isHost=false;net.status='off';
}
const stripDeck=s=>{const{deck,...rest}=s;return rest};
function saveHost(){if(net.isHost&&app.code){ls.set('ti_host',{code:app.code,s:app.s,at:Date.now()});try{sessionStorage.setItem('ti_hosting',app.code)}catch{}}}
function broadcast(){
  if(!net.isHost)return;
  const msg={t:'state',s:stripDeck(app.s)};
  net.conns.forEach(c=>{if(c.open)try{c.send(msg)}catch{}});
  saveHost();
}
// apply a full state from the network without breaking an in-progress drag
function applyState(next){
  const prev=app.s;
  const strip=o=>o?JSON.stringify({...o,needle:0,deck:0}):'';
  if(prev&&strip(prev)===strip(next)){
    if(!app.dragging){app.s.needle=next.needle;setNeedle(next.needle)}
    return;
  }
  app.s=next;
  if(prev&&next.round!==prev.round)app.selOpt=null;
  if(app.dragging&&app.dragVal!=null)app.s.needle=app.dragVal;
  if(app.s.options)markSeen(app.s.options);
  if(app.dragging)return;
  render();
}
let wakeLock=null;
async function keepAwake(){try{wakeLock=await navigator.wakeLock?.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&net.isHost)keepAwake()});

function hostRoom(code,state,resuming=false){
  if(typeof Peer==='undefined'){toast('Couldn’t load the online engine. Check your internet and reload.');return}
  cleanupPeer();
  net.isHost=true;app.mode='online';app.code=code;app.s=state;app.screen='game';app.selOpt=null;app.peek=false;
  setHash(code);render();keepAwake();
  const peer=new Peer(PREFIX+code);net.peer=peer;
  peer.on('open',()=>{net.retry=0;setNet('ok');saveHost()});
  peer.on('connection',c=>{
    c.on('open',()=>{net.conns.push(c);try{c.send({t:'full',s:app.s})}catch{}});
    c.on('data',m=>onHostMsg(c,m));
    c.on('close',()=>{net.conns=net.conns.filter(x=>x!==c)});
    c.on('error',()=>{});
  });
  peer.on('disconnected',()=>{setNet('down');setTimeout(()=>{if(net.peer===peer&&!peer.destroyed)try{peer.reconnect()}catch{}},1500)});
  peer.on('error',e=>{
    if(net.peer!==peer)return;
    if(e.type==='unavailable-id'){
      if(resuming&&net.retry<6){net.retry++;setNet('down');setTimeout(()=>{if(net.peer===peer)hostRoom(code,app.s,true)},3000)}
      else if(resuming){toast('This room is already open in another tab.');goHome()}
      else hostRoom(randCode(),state); // code clash: pick another
    } else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setNet('down')}
  });
}
function onHostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='patch'&&m.patch&&typeof m.patch==='object'&&!Array.isArray(m.patch)){
    applyState(deepMerge(app.s,m.patch));broadcast();
  } else if(m.t==='needle'&&typeof m.v==='number'&&isFinite(m.v)){
    const v=Math.min(180,Math.max(0,m.v));app.s.needle=v;if(!app.dragging)setNeedle(v);
    net.conns.forEach(x=>{if(x!==c&&x.open)try{x.send({t:'needle',v})}catch{}});
  }
}

function joinRoom(code){
  if(typeof Peer==='undefined'){toast('Couldn’t load the online engine. Check your internet and reload.');return}
  cleanupPeer();
  net.isHost=false;app.mode='online';app.code=code;app.s=null;app.screen='game';app.selOpt=null;app.peek=false;
  setHash(code);render();
  const peer=new Peer();net.peer=peer;
  peer.on('open',()=>connectHost(peer));
  peer.on('disconnected',()=>{setTimeout(()=>{if(net.peer===peer&&!peer.destroyed)try{peer.reconnect()}catch{}},1500)});
  peer.on('error',e=>{
    if(net.peer!==peer)return;
    if(e.type==='peer-unavailable'){
      if(!app.s){toast('No room '+code+' right now. Check the code, or ask the host to keep their tab open.');goHome()}
      else{setNet('down');setTimeout(()=>{if(net.peer===peer)connectHost(peer)},3000)}
    } else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setNet('down')}
  });
}
function connectHost(peer){
  const c=peer.connect(PREFIX+app.code,{reliable:true});net.hostConn=c;
  const slow=setTimeout(()=>{if(!app.s&&net.hostConn===c)toast('Still connecting to the host…')},8000);
  c.on('open',()=>setNet('ok'));
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='full'&&m.s){clearTimeout(slow);setNet('ok');const first=!app.s;applyState(m.s);
      if(first&&!app.s.players?.[app.myId]&&myName&&app.s.status==='lobby')joinSeat(myName)}
    else if(m.t==='state'&&m.s&&app.s){applyState({...m.s,deck:app.s.deck})}
    else if(m.t==='needle'&&typeof m.v==='number'&&app.s){app.s.needle=m.v;if(!app.dragging)setNeedle(m.v)}
  });
  c.on('close',()=>{
    if(net.hostConn!==c)return;
    setNet('down');toast('Lost the host. Trying to reconnect…');
    setTimeout(()=>{if(net.hostConn===c&&net.peer&&!net.peer.destroyed)connectHost(net.peer)},2500);
  });
  c.on('error',()=>{});
}
function joinSeat(name){
  const s=app.s;if(!s)return;
  if(!name){toast('Enter your name first');return}
  myName=name;ls.set('ti_name',name);
  const team=teamOf(s,'A').length<=teamOf(s,'B').length?'A':'B';
  push({players:{[app.myId]:{name,team,joined:Date.now()}}});
}

function goHome(){
  if(net.isHost)ls.set('ti_host',null);
  cleanupPeer();
  app.screen='home';app.mode=null;app.s=null;app.code=null;app.peek=false;app.selOpt=null;
  try{history.replaceState(null,'',location.pathname+location.search)}catch{}
  render();
}

/* ---------------- custom spectrums (saved on this device; they go into rooms you host) ---------------- */
function saveCustom(list){app.custom=list;ls.set('ti_custom',list);render()}

/* ---------------- events ---------------- */
document.addEventListener('input',e=>{
  const i=e.target.dataset.lp;if(i!=null){app.localPlayers[+i].name=e.target.value;ls.set('ti_local_players',app.localPlayers)}
  if(e.target.id==='nm'){myName=e.target.value.trim();ls.set('ti_name',myName)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='goal'&&app.s)push({goal:+e.target.value});
  if(e.target.id==='lgoal')app.localGoal=+e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='clue')act('giveClue');
  if(e.target.id==='joincode')act('join');
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;act(b.dataset.act,b.dataset)});

async function act(a,d={}){
  const s=app.s;
  switch(a){
    case 'leave': if(app.mode==='local')ls.set('ti_local_game',null); goHome(); break;
    case 'create':{
      const name=($('#nm')?.value||'').trim(); if(!name)return toast('Enter your name first');
      myName=name;ls.set('ti_name',name);
      const g=newGame(10);g.players[app.myId]={name,team:'A',joined:Date.now()};
      hostRoom(randCode(),g);break;}
    case 'join':{
      const code=($('#joincode')?.value||'').trim().toUpperCase(); if(!/^[A-Z]{4}$/.test(code))return toast('Room codes are 4 letters');
      const name=($('#nm')?.value||'').trim(); if(name){myName=name;ls.set('ti_name',name)}
      joinRoom(code);break;}
    case 'joinSeat': joinSeat(($('#lobbyname')?.value||'').trim()); break;
    case 'rename':{const n=($('#lobbyname')?.value||'').trim();if(!n)return;myName=n;ls.set('ti_name',n);push({players:{[app.myId]:{name:n}}});toast('Name saved');break;}
    case 'switch':{const t=s.players[app.myId].team;push({players:{[app.myId]:{team:other(t),joined:Date.now()}}});break;}
    case 'copy':{const link=location.origin+location.pathname+'#'+app.code;
      try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({title:'Tuned In',text:'Join my Tuned In room '+app.code,url:link});break}}catch(e){if(e&&e.name==='AbortError')break}
      try{await navigator.clipboard.writeText(link);toast('Invite link copied')}catch{toast('Room code: '+app.code)}break;}
    case 'start': if(playable(s,'A')||playable(s,'B'))push(startGamePatch(s)); break;
    case 'pickOpt': app.selOpt=+d.i; render(); break;
    case 'redraw': app.selOpt=null; push(draw2(s)); break;
    case 'giveClue':{
      const clue=($('#clue')?.value||'').trim(); if(app.selOpt==null)return toast('Pick a spectrum first'); if(!clue)return toast('Type a clue');
      const card=s.options[app.selOpt]; app.selOpt=null; app.peek=false; markSeen([card]);
      push({card,clue,phase:'guess',needle:90});
      if(app.mode==='local')toast('Now show the screen to team '+s.turnTeam);
      break;}
    case 'peek': app.peek=true; render(); break;
    case 'skip': push(nextPatch(s)); break;
    case 'nudge': nudge(+d.d); break;
    case 'lock':{
      const needle=app.dragVal!=null&&app.dragging?app.dragVal:s.needle;
      if(teamOf(s,other(s.turnTeam)).length>0)push({phase:'counter',needle});
      else push(finishPatch(s,null,needle));
      break;}
    case 'counter': push(finishPatch(s,d.v,s.needle)); break;
    case 'next': app.selOpt=null; push(nextPatch(s)); break;
    case 'rematch': app.selOpt=null; push(rematchPatch(s)); break;
    case 'localSetup': app.screen='localSetup'; render(); break;
    case 'lpAdd': app.localPlayers.push({name:'',team:app.localPlayers.filter(p=>p.team==='A').length>app.localPlayers.filter(p=>p.team==='B').length?'B':'A'});ls.set('ti_local_players',app.localPlayers);render();break;
    case 'lpDel': app.localPlayers.splice(+d.i,1);ls.set('ti_local_players',app.localPlayers);render();break;
    case 'lpTeam':{const p=app.localPlayers[+d.i];p.team=other(p.team);ls.set('ti_local_players',app.localPlayers);render();break;}
    case 'localStart':{
      const ps=app.localPlayers.map((p,i)=>({name:p.name.trim()||('Player '+(i+1)),team:p.team}));
      const g=newGame(app.localGoal);ps.forEach((p,i)=>g.players['p'+i]={...p,joined:i});
      if(!playable(g,'A')&&!playable(g,'B'))return toast('Put at least 2 players on one team');
      app.mode='local';app.screen='game';app.s=deepMerge(g,startGamePatch(g));app.peek=false;app.selOpt=null;
      ls.set('ti_local_game',app.s);render();break;}
    case 'addCustom':{
      const l=($('#cl')?.value||'').trim(),r=($('#cr')?.value||'').trim();if(!l||!r)return toast('Fill in both ends');
      $('#cl').value='';$('#cr').value='';
      await saveCustom([...app.custom,{l,r}]);toast('Added. It’ll show up in new games.');break;}
    case 'delCustom':{const list=app.custom.slice();list.splice(+d.i,1);await saveCustom(list);break;}
  }
}

/* ---------------- boot ---------------- */
function boot(){
  app.custom=ls.get('ti_custom',[]);
  const saved=ls.get('ti_local_game',null);
  if(saved&&saved.status==='play'){app.mode='local';app.screen='game';app.s=saved}
  // one id per tab (survives refresh), so two tabs on one device count as two players
  let id=null;try{id=sessionStorage.getItem('ti_id')}catch{}
  if(!id){id='u'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('ti_id',id)}catch{}}
  app.myId=id;
  const h=(location.hash||'').replace('#','').toUpperCase();
  const hosted=ls.get('ti_host',null);
  if(/^[A-Z]{4}$/.test(h)){
    // reopening a room you host (e.g. after a refresh) resumes it; otherwise join as a guest
    let mine=false;try{mine=sessionStorage.getItem('ti_hosting')===h}catch{}
    if(mine&&hosted&&hosted.code===h&&hosted.s&&Date.now()-hosted.at<6*3600e3)hostRoom(h,hosted.s,true);
    else joinRoom(h);
    if(!myName)toast('Type your name in the lobby to join');
    return;
  }
  render();
}
boot();
</script>
